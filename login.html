<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Burger Admin</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;

      background:
      linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.92)),
      url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1600');

      background-size:cover;
      background-position:center;
      position:relative;
    }

    body::before{
      content:'';
      position:absolute;
      width:500px;
      height:500px;
      background:#ff9800;
      filter:blur(180px);
      opacity:.12;
      top:-120px;
      left:-120px;
    }

    .login-container{
      width:100%;
      max-width:440px;
      padding:20px;
      position:relative;
      z-index:2;
    }

    .login-box{

      background:rgba(20,20,20,.92);

      border:1px solid rgba(255,255,255,.06);

      backdrop-filter:blur(18px);

      border-radius:32px;

      padding:45px;

      box-shadow:
      0 20px 60px rgba(0,0,0,.45);

    }

    .logo-login{
      text-align:center;
      margin-bottom:35px;
    }

    .logo-login h1{
      font-size:42px;
      color:#ff9800;
      font-weight:800;
      letter-spacing:1px;
    }

    .logo-login p{
      color:#aaa;
      margin-top:10px;
    }

    .login-box h2{
      font-size:32px;
      margin-bottom:25px;
      text-align:center;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:10px;
      color:#ccc;
      font-size:14px;
    }

    .input-group input{

      width:100%;

      background:#1d1d1d;

      border:1px solid #2b2b2b;

      color:#fff;

      padding:16px;

      border-radius:14px;

      outline:none;

      transition:.3s;

      font-size:15px;

    }

    .input-group input:focus{
      border-color:#ff9800;
      box-shadow:0 0 0 4px rgba(255,152,0,.1);
    }

    .btn-login{
      width:100%;
      height:58px;

      background:linear-gradient(
        135deg,
        #ff9800,
        #ff6a00
      );

      border:none;
      border-radius:16px;

      color:#fff;

      font-size:16px;
      font-weight:700;

      cursor:pointer;

      transition:.3s;

      margin-top:10px;
    }

    .btn-login:hover{
      transform:translateY(-4px);
      box-shadow:0 15px 35px rgba(255,152,0,.3);
    }

    .extras{

      margin-top:25px;

      display:flex;

      justify-content:space-between;

      gap:15px;

      flex-wrap:wrap;

    }

    .extras button{

      background:none;

      border:none;

      color:#ff9800;

      cursor:pointer;

      font-size:14px;

      transition:.3s;

    }

    .extras button:hover{
      opacity:.7;
    }

    .copyright{
      margin-top:30px;
      text-align:center;
      color:#666;
      font-size:13px;
    }

    .divider{
        width:100%;
        height:1px;
        background:rgba(255,255,255,.08);
        margin:30px 0;
    }

    @media(max-width:500px){

      .login-box{
        padding:35px 25px;
      }

      .logo-login h1{
        font-size:34px;
      }

      .login-box h2{
        font-size:28px;
      }

    }

  </style>

</head>
<body>

<div class="login-container">

  <div class="login-box">

    <div class="logo-login">

      <h1>BURGER ADMIN</h1>

      <p>
        Painel administrativo da hamburgueria
      </p>

    </div>

    <h2>
      Entrar
    </h2>

    <form id="loginForm">

      <div class="input-group">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu email"
          required
        >

      </div>

      <div class="input-group">

        <label>Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        >

      </div>

      <button
        class="btn-login"
        type="submit"
      >
        Entrar
      </button>

    </form>

    <div class="divider"></div>

<form id="registerForm">

  <h2 style="margin-bottom:20px;">
    Criar Conta
  </h2>

  <div class="input-group">

    <label>Email</label>

    <input
      type="email"
      id="registerEmail"
      placeholder="Digite o email"
      required
    >

  </div>

  <div class="input-group">

    <label>Senha</label>

    <input
      type="password"
      id="registerSenha"
      placeholder="Digite a senha"
      required
    >

  </div>

  <button
    class="btn-login"
    type="submit"
  >
    Criar Conta
  </button>

</form>

    <div class="extras">

      <button onclick="recuperarSenha()">
        Esqueci minha senha
      </button>

      <button onclick="cadastrarAdmin()">
        Criar administrador
      </button>

    </div>

    <div class="copyright">

      © 2026 Burger House

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
