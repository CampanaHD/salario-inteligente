<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Estoque</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    .topo-pagina{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
      gap:20px;
      flex-wrap:wrap;
    }

    .pesquisa{
      max-width:350px;
      width:100%;
    }

    .tabela-container{
      overflow:auto;
      background:#141414;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.05);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }

    thead{
      background:#1d1d1d;
    }

    th{
      padding:20px;
      text-align:left;
      color:#ff9800;
      font-size:14px;
    }

    td{
      padding:20px;
      border-top:1px solid rgba(255,255,255,.05);
    }

    tr:hover{
      background:#1b1b1b;
    }

    .status{
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
    }

    .status-ok{
      background:#103b1d;
      color:#4ade80;
    }

    .status-baixo{
      background:#4a1010;
      color:#ff5a5a;
    }

    .acoes{
      display:flex;
      gap:10px;
    }

    .btn-editar{
      background:#ff9800;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }

    .btn-remover{
      background:#b91c1c;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }

    .grid-form{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .alertas-box{
      margin-top:30px;
    }

  </style>

</head>
<body>

<div class="admin-layout">

  <aside>

    <h2>Burger Admin</h2>

    <a href="admin.html">Dashboard</a>
    <a href="pedidos.html">Pedidos</a>
    <a href="produtos.html">Produtos</a>
    <a href="estoque.html">Estoque</a>
    <a href="fornecedores.html">Fornecedores</a>

  </aside>

  <main>

    <div class="topo-pagina">

      <div>
        <h1>Controle de Estoque</h1>
        <p style="color:#aaa;">
          Gerencie ingredientes e níveis de estoque
        </p>
      </div>

      <input
        type="text"
        placeholder="Pesquisar ingrediente..."
        class="pesquisa"
        id="pesquisaIngrediente"
        onkeyup="pesquisarIngrediente()"
      >

    </div>

    <form id="formIngrediente">

      <h2 style="margin-bottom:25px;">
        Novo Ingrediente
      </h2>

      <div class="grid-form">

        <input
          type="text"
          id="nomeIngrediente"
          placeholder="Nome do ingrediente"
          required
        >

        <input
          type="number"
          id="quantidadeIngrediente"
          placeholder="Quantidade"
          required
        >

        <select id="unidadeIngrediente">

          <option value="kg">KG</option>
          <option value="g">Gramas</option>
          <option value="L">Litros</option>
          <option value="ml">ML</option>
          <option value="un">Unidade</option>

        </select>

        <input
          type="number"
          id="estoqueMinimo"
          placeholder="Estoque mínimo"
          required
        >

      </div>

      <button class="btn" type="submit">
        Salvar Ingrediente
      </button>

    </form>

    <div class="alertas-box" id="alertasEstoque">

    </div>

    <div class="tabela-container" style="margin-top:30px;">

      <table>

        <thead>

          <tr>
            <th>Ingrediente</th>
            <th>Quantidade</th>
            <th>Estoque Mínimo</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody id="tabelaEstoque">

        </tbody>

      </table>

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/estoque.js"></script>

</body>
</html>
