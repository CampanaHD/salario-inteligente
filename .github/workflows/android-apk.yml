name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-conector/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: android-conector
        run: gradle --no-daemon assembleDebug

      - name: Preparar arquivo para download
        run: |
          mkdir -p dist
          cp android-conector/app/build/outputs/apk/debug/app-debug.apk dist/salario-inteligente-conector-debug.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: salario-inteligente-conector-apk
          path: dist/salario-inteligente-conector-debug.apk
          if-no-files-found: error
          retention-days: 30
